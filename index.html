<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Radcomputer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Radcomputer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#262d36;
    --text:#e6edf3; --muted:#8b949e; --accent:#3ddc97; --warn:#f0883e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  [hidden]{display:none!important}
  #mapWrap{flex:1;min-height:30vh;position:relative;border-bottom:1px solid var(--line)}
  #map{position:absolute;inset:0}
  .leaflet-container{background:#161b22}
  /* Nur Rückfallebene ohne WebGL: OSM-Rasterkarte grau abdunkeln */
  .rasterdark .leaflet-tile-pane{filter:grayscale(1) invert(1) brightness(1.05) contrast(.85)}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  /* unten nur knapp Abstand zum Home-Balken lassen, damit der Block weiter unten sitzt */
  .dash{padding:10px max(12px,env(safe-area-inset-right)) max(6px,calc(env(safe-area-inset-bottom) - 16px)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px}
  .speed{display:flex;align-items:baseline;justify-content:center;gap:8px}
  .speed .val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(56px,18vw,96px);line-height:1;letter-spacing:-2px}
  .speed .unit{color:var(--muted);font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 6px;text-align:center}
  .cell .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .cell .v{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:500;margin-top:2px}
  .cell .v small{font-size:11px;color:var(--muted);font-family:Inter,sans-serif}
  .btns{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}
  button{font:600 15px Inter,sans-serif;border:0;border-radius:10px;padding:12px 8px;cursor:pointer;color:var(--bg);background:var(--accent)}
  button.sec{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  button.pause{background:var(--warn)}
  .status{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--accent)}
  /* Navigation */
  .navbtn{position:absolute;left:10px;bottom:10px;z-index:1000;width:auto;padding:10px 16px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  /* Navi-Anzeige frei auf der Karte (ohne Kachel): Mitte = nächste Abbiegung, rechts = Ziel/Rest/Ankunft.
     Scharfe dunkle Kontur statt weichem Schatten, damit es auf der Karte lesbar bleibt, aber nicht verschwimmt. */
  #navBar{position:absolute;top:6px;left:0;right:0;z-index:1000;pointer-events:none;
    color:#fff;--o:#0e1116;
    /* harte Kontur aus mehreren unverwischten Schatten (Safari rendert -webkit-text-stroke breiig) */
    text-shadow:2px 0 0 var(--o),-2px 0 0 var(--o),0 2px 0 var(--o),0 -2px 0 var(--o),
      1.5px 1.5px 0 var(--o),-1.5px 1.5px 0 var(--o),1.5px -1.5px 0 var(--o),-1.5px -1.5px 0 var(--o)}
  #navNow{display:flex;flex-direction:column;align-items:center;margin:0 auto;max-width:calc(100% - 150px)}
  #navNow .row{display:flex;align-items:center;gap:6px}
  #navArrow{width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-size:40px;line-height:1}
  #navArrow svg{width:58px;height:58px;display:block}
  #navDist{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:28px}
  #navDist:empty{display:none}
  #navText{font-weight:600;font-size:15px;text-align:center}
  #navSub{font-size:12px;text-align:center;color:#c9d1d9}
  #navText:empty,#navSub:empty{display:none}
  #navEta{position:absolute;top:0;right:10px;text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;line-height:1.3}
  #navEta .f{font-size:22px;text-shadow:none}
  /* Quellenangabe der Karte klein und dunkel */
  .leaflet-container .leaflet-control-attribution{background:rgba(14,17,22,.6);color:#6b7480;font-size:9px;padding:0 4px}
  .leaflet-control-attribution a{color:#8b949e}
  #navPanel{position:absolute;left:8px;right:8px;bottom:8px;z-index:1001;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 16px);overflow-y:auto;box-shadow:0 2px 12px rgba(0,0,0,.6)}
  #navPanel form{display:flex;gap:6px}
  #navPanel input[type=search]{flex:1;min-width:0;font:16px Inter,sans-serif;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  #navPanel form button{padding:10px 14px}
  #navResults{list-style:none;display:flex;flex-direction:column;gap:4px}
  #navResults li{padding:9px 10px;border-radius:8px;background:var(--bg);font-size:14px;cursor:pointer}
  #navResults li.muted{background:none;color:var(--muted);cursor:default}
  #navResults li small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .navrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .navrow button,.navrow label{padding:10px 6px;font-size:14px}
  label.sec{font:600 14px Inter,sans-serif;border-radius:10px;text-align:center;cursor:pointer;background:var(--bg);color:var(--text);border:1px solid var(--line)}
  #routePick{position:absolute;left:8px;right:8px;bottom:8px;z-index:1001;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:calc(100% - 16px);overflow-y:auto}
  #routePick .rt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:0 2px}
  #routeList{list-style:none;display:flex;flex-direction:column;gap:6px}
  #routeList li{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:var(--bg);cursor:pointer}
  #routeList .sw{width:14px;height:14px;border-radius:50%;flex:none}
  #routeList .m{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px}
  #routeList .s{font-size:12px;color:var(--muted);margin-top:1px}
  #routePick button{padding:8px;font-size:14px}
  .navhint{font-size:12px;color:var(--muted);text-align:center}
  .leaflet-popup-content button{padding:8px 12px;font-size:14px}
  @media (orientation:landscape) and (max-height:500px){
    body{flex-direction:row}
    #mapWrap{border-bottom:0;border-right:1px solid var(--line)}
    .dash{width:46%;overflow-y:auto}
  }
</style>
</head>
<body>
<div id="mapWrap">
  <div id="map"></div>
  <div id="navBar" hidden>
    <div id="navNow">
      <div class="row"><div id="navArrow"></div><div id="navDist"></div></div>
      <div id="navText"></div><div id="navSub"></div>
    </div>
    <div id="navEta" hidden><div class="f">🏁</div><div id="navRest"></div><div id="navTime"></div></div>
  </div>
  <button class="sec navbtn" id="navBtn">Ziel</button>
  <div id="navPanel" hidden>
    <form id="navForm"><input type="search" id="navQuery" placeholder="Adresse oder Ort suchen" enterkeyhint="search" autocomplete="off"><button type="submit">Suchen</button></form>
    <ul id="navResults"></ul>
    <div class="navrow">
      <label class="sec">GPX laden<input type="file" id="gpxFile" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden></label>
      <button class="sec" id="navEnd">Navi beenden</button>
      <button class="sec" id="navClose">Schließen</button>
    </div>
    <div class="navhint">Tipp: Lange auf die Karte drücken, um dort ein Ziel zu setzen.</div>
  </div>
  <div id="routePick" hidden>
    <div class="rt">Route wählen</div>
    <ul id="routeList"></ul>
    <button class="sec" id="routeCancel">Abbrechen</button>
  </div>
</div>
<div class="dash">
  <div class="speed"><span class="val" id="speed">0.0</span><span class="unit">km/h</span></div>
  <div class="grid">
    <div class="cell"><div class="l">Distanz</div><div class="v" id="dist">0.00 <small>km</small></div></div>
    <div class="cell"><div class="l">Zeit</div><div class="v" id="time">0:00:00</div></div>
    <div class="cell"><div class="l">Schnitt</div><div class="v" id="avg">0.0 <small>km/h</small></div></div>
    <div class="cell"><div class="l">Max</div><div class="v" id="max">0.0 <small>km/h</small></div></div>
    <div class="cell"><div class="l">Höhenmeter</div><div class="v" id="alt">↑0 <small>m</small></div></div>
    <div class="cell"><div class="l">Uhrzeit</div><div class="v" id="clock">--:--</div></div>
  </div>
  <div class="btns">
    <button id="startBtn">Start</button>
    <button class="sec" id="centerBtn">Zentrieren</button>
    <button class="sec" id="resetBtn">Reset</button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Bereit</span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
// ---- Karte: Vektorkarte von OpenFreeMap (OSM-Daten, kostenlos, kein API-Key) mit eigenem dunklen Stil ----
const map = L.map('map', {zoomControl:false, attributionControl:true, maxZoom:19}).setView([51.16, 10.45], 6);
map.attributionControl.setPrefix(false);
// Farben der Karte – hier anpassen
const MAPCOL = {bg:'#161b22', water:'#1c3b52', park:'#18302a', build:'#1f262f', minor:'#343d49', major:'#4b5767',
  motor:'#6b5a3a', rail:'#2c333c', border:'#3a3f47', cycle:'#2f6b58', text:'#aab4c0', waterText:'#6f9bb8', halo:'#0e1116'};
// Basis ist der Stil "liberty" (enthält alle Ebenen); POI-Symbole und Hausnummern raus, alle Farben ersetzen
function darkStyle(st){
  const C = MAPCOL;
  st.layers = st.layers.filter(l => !/poi|aeroway|housenumber|ferry/.test(l.id));
  for (const l of st.layers) {
    const p = l.paint = l.paint || {}, id = l.id;
    if (l.type === 'background') p['background-color'] = C.bg;
    else if (l.type === 'fill' || l.type === 'fill-extrusion') {
      const k = l.type + '-color'; delete p[l.type + '-pattern']; delete p['fill-outline-color'];
      p[k] = /water/.test(id) ? C.water : /park|wood|grass|landcover|landuse_(park|cemetery)/.test(id) ? C.park
        : /building/.test(id) ? C.build : C.bg;
      if (l.type === 'fill-extrusion') { p['fill-extrusion-height'] = 0; p['fill-extrusion-base'] = 0; }
    } else if (l.type === 'line') {
      delete p['line-pattern'];
      p['line-color'] = /water|river/.test(id) ? C.water : /rail|transit/.test(id) ? C.rail : /boundary/.test(id) ? C.border
        : /casing/.test(id) ? C.bg : /motorway|trunk/.test(id) ? C.motor : /primary|secondary|tertiary/.test(id) ? C.major
        : /cycle|path|track/.test(id) ? C.cycle : C.minor;
    } else if (l.type === 'symbol') {
      if (l.layout) delete l.layout['icon-image'];
      p['text-color'] = /water/.test(id) ? C.waterText : C.text; p['text-halo-color'] = C.halo; p['text-halo-width'] = 1.5;
    }
  }
  return st;
}
function rasterFallback(){  // ohne WebGL oder wenn der Stil nicht lädt: OSM-Rasterkarte, grau abgedunkelt
  document.body.classList.add('rasterdark');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap-Mitwirkende'}).addTo(map);
}
const webgl = (() => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch(_) { return false; } })();
if (window.maplibregl && L.maplibreGL && webgl) {
  fetch('https://tiles.openfreemap.org/styles/liberty').then(r => r.json())
    .then(st => L.maplibreGL({style: darkStyle(st),
      attribution:'&copy; <a href="https://openfreemap.org">OpenFreeMap</a> &copy; OpenMapTiles &copy; OpenStreetMap-Mitwirkende'}).addTo(map))
    .catch(rasterFallback);
} else rasterFallback();
// Geplante Route (Navigation) – vor der gefahrenen Strecke angelegt, damit sie darunter liegt
const routeLine = L.polyline([], {color:'#4ea1ff', weight:7, opacity:.7}).addTo(map);
const destMarker = L.circleMarker([0,0], {radius:7, color:'#fff', weight:2, fillColor:'#4ea1ff', fillOpacity:1});
// Strecke in Abschnitten: nach jeder Pause beginnt ein neuer (keine gerade Linie über die Pause)
const track = L.polyline([[]], {color:'#3ddc97', weight:5, opacity:.9}).addTo(map);
const me = L.circleMarker([0,0], {radius:8, color:'#fff', weight:3, fillColor:'#3ddc97', fillOpacity:1});
function addPoint(pt, newSeg){
  const segs = track.getLatLngs();
  let seg = segs[segs.length-1];
  if (newSeg && seg.length) { seg = []; segs.push(seg); }
  track.addLatLng([pt.lat, pt.lon], seg);
}
const trackPoints = () => track.getLatLngs().reduce((n, s) => n + s.length, 0);

// ---- Zustand ----
let watchId = null, running = false, follow = true;
let last = null, distM = 0, maxKmh = 0, movingMs = 0, lastTick = null;
let lastFixAt = 0;      // Empfangszeit des letzten GPS-Punkts (für Fahrzeit bei Signalverlust)
let newSeg = true;      // nach Start/Weiter: nächster guter Punkt beginnt einen neuen Abschnitt
let lastGood = null;    // letzter Punkt der gefahrenen Strecke (Distanz wird ab hier gemessen)
let spdHist = [];       // letzte Tempo-Rohwerte, Median gegen Ausreißer
let climbM = 0, descM = 0, altRef = null, altSmooth = null;  // Höhenmeter bergauf/bergab
let wakeLock = null;

const $ = id => document.getElementById(id);
const fmtTime = ms => { const s = Math.floor(ms/1000);
  return `${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };

function haversine(a, b){
  const R = 6371000, r = Math.PI/180;
  const dLat = (b.lat-a.lat)*r, dLon = (b.lon-a.lon)*r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

function render(kmh){
  $('speed').textContent = kmh.toFixed(1);
  $('dist').innerHTML = (distM/1000).toFixed(2) + ' <small>km</small>';
  $('max').innerHTML = maxKmh.toFixed(1) + ' <small>km/h</small>';
  const avg = movingMs > 0 ? (distM/1000) / (movingMs/3600000) : 0;
  $('avg').innerHTML = avg.toFixed(1) + ' <small>km/h</small>';
  $('time').textContent = fmtTime(movingMs);
  $('alt').innerHTML = '↑' + Math.round(climbM) + ' <small>m</small>';
}

// Tempo-Rohwert: GPS-Tempo (Doppler, zuverlässig) bevorzugen; Strecke/Zeit nur zwischen zwei genauen Punkten
// mit mindestens 1 s Abstand – sonst erzeugen GPS-Sprünge Werte wie 150 km/h
function rawSpeed(c, prev, pt){
  if (c.accuracy > 50) return null;
  if (c.speed != null && isFinite(c.speed) && c.speed >= 0) return c.speed * 3.6;
  if (!prev) return null;
  const dt = (pt.t - prev.t) / 1000;
  if (dt < 1 || c.accuracy > 20 || prev.acc > 20) return null;
  return haversine(prev, pt) / dt * 3.6;
}
// Geglättetes Tempo: Median der letzten 3 plausiblen Werte – ein einzelner Ausreißer kommt nie durch
function smoothSpeed(raw){
  if (raw != null && raw <= 90) { spdHist.push(raw); if (spdHist.length > 3) spdHist.shift(); }
  if (!spdHist.length) return 0;
  const s = [...spdHist].sort((a, b) => a - b);
  return s.length === 2 ? Math.min(s[0], s[1]) : s[Math.floor(s.length / 2)];
}

// Höhenmeter: GPS-Höhe glätten und nur Änderungen ab 5 m zählen (GPS-Höhe schwankt sonst ständig um ein paar Meter)
function updateAlt(c){
  if (c.altitude == null || !isFinite(c.altitude)) return;
  if (c.altitudeAccuracy != null && c.altitudeAccuracy > 25) return;
  altSmooth = altSmooth == null ? c.altitude : altSmooth + 0.15 * (c.altitude - altSmooth);
  if (!running || altRef == null) { altRef = altSmooth; return; }   // in der Pause nichts zählen
  const diff = altSmooth - altRef;
  if (diff >= 5) { climbM += diff; altRef = altSmooth; }
  else if (diff <= -5) { descM -= diff; altRef = altSmooth; }
}

function onPos(p){
  const c = p.coords, now = p.timestamp;
  const pt = {lat:c.latitude, lon:c.longitude, t:now, acc:c.accuracy};
  lastFixAt = Date.now();
  $('dot').classList.add('on');
  $('status').textContent = `GPS ±${Math.round(c.accuracy)} m`;
  updateAlt(c);

  me.setLatLng([pt.lat, pt.lon]); if (!map.hasLayer(me)) me.addTo(map);
  if (follow) map.setView([pt.lat, pt.lon], Math.max(map.getZoom(), 16));

  let kmh = smoothSpeed(rawSpeed(c, last, pt));
  if (kmh < 1.5) kmh = 0;
  if (running && c.accuracy < 30) {
    if (newSeg || !lastGood) {
      // Erster Punkt nach Start/Weiter: Strecke seit der Pause nicht mitzählen
      addPoint(pt, true); newSeg = false; lastGood = pt;
    } else {
      // Distanz ab dem letzten Streckenpunkt: Stillstand-Rauschen (< 3 m) und Sprünge (> 90 km/h) ignorieren
      const d = haversine(lastGood, pt), dt = (pt.t - lastGood.t) / 1000;
      if (d > 3 && dt > 0 && d / dt * 3.6 < 90) { distM += d; addPoint(pt); lastGood = pt; }
    }
    if (kmh > maxKmh) maxKmh = kmh;
  }
  last = pt;
  window._kmh = kmh;
  render(kmh);
  updateNav(pt, c.accuracy);
  save();
}

// ---- Fahrt sichern (iOS beendet Web-Apps im Hintergrund gern) ----
function save(){
  try {
    localStorage.setItem('ride', JSON.stringify({
      distM, maxKmh, movingMs, running, climbM, descM,
      track: track.getLatLngs().map(s => s.map(p => [+p.lat.toFixed(6), +p.lng.toFixed(6)]))
    }));
  } catch(_) {}
}
function restore(){
  try {
    const r = JSON.parse(localStorage.getItem('ride') || 'null');
    if (!r) return;
    distM = r.distM || 0; maxKmh = r.maxKmh || 0; movingMs = r.movingMs || 0;
    climbM = r.climbM || 0; descM = r.descM || 0;
    let segs = r.track || [];
    if (segs.length && typeof segs[0][0] === 'number') segs = [segs];  // altes Format: eine flache Liste
    track.setLatLngs(segs.length ? segs : [[]]);
    if (trackPoints()) map.fitBounds(track.getBounds(), {padding:[20,20]});
    if (movingMs > 0) { $('startBtn').textContent = 'Weiter'; }
    render(0);
  } catch(_) {}
}

function onErr(e){
  $('dot').classList.remove('on');
  $('status').textContent = e.code === 1 ? 'Standortzugriff verweigert' :
    'GPS-Fehler: ' + e.message + (location.protocol !== 'https:' && location.hostname !== 'localhost' ? ' (HTTPS nötig)' : '');
}

function startGps(){
  if (!('geolocation' in navigator)) { $('status').textContent = 'Kein GPS verfügbar'; return; }
  if (watchId === null)
    watchId = navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:0, timeout:15000});
}

// ---- Bildschirm anlassen ----
// 1) Wake Lock API (iOS 16.4+ in Safari, 18.4+ als Home-Screen-App)
// 2) Rückfallebene: unsichtbares, stummes Video in Schleife – wie bei Video-Apps,
//    wirkt auch wenn die Auto-Sperre per Firmenrichtlinie fest eingestellt ist.
const awakeVideo = document.createElement('video');
for (const [src,type] of [['keepawake.mp4','video/mp4'],['keepawake.webm','video/webm']]) {
  const el = document.createElement('source'); el.src = src; el.type = type; awakeVideo.appendChild(el);
}
awakeVideo.muted = true; awakeVideo.loop = true;
awakeVideo.setAttribute('playsinline', ''); awakeVideo.setAttribute('muted', '');
awakeVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0.01;pointer-events:none;bottom:0;left:0';
document.body.appendChild(awakeVideo);

async function keepAwake(on){
  if (on) {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(_) { wakeLock = null; }
    try { await awakeVideo.play(); } catch(_) {}
  } else {
    try { if (wakeLock) await wakeLock.release(); } catch(_) {}
    wakeLock = null;
    awakeVideo.pause();
  }
}
document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') keepAwake(true); });
// Video läuft ab und zu aus (z. B. nach Anruf) – wieder anwerfen
setInterval(() => { if (running && awakeVideo.paused) awakeVideo.play().catch(() => {}); }, 10000);

// Fahrzeit nur zählen, wenn man sich bewegt und das GPS noch frische Punkte liefert
setInterval(() => {
  const now = Date.now();
  const fresh = now - lastFixAt < 5000;
  if (running && !fresh && lastFixAt) {
    window._kmh = 0; $('speed').textContent = '0.0';

  }
  if (running && lastTick && fresh && (window._kmh || 0) > 0) movingMs += now - lastTick;
  lastTick = now;
  $('clock').textContent = new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
  if (running) $('time').textContent = fmtTime(movingMs);
}, 1000);

$('startBtn').onclick = () => {
  running = !running;
  if (running) { newSeg = true; spdHist = []; }
  startGps();
  keepAwake(running);
  $('startBtn').textContent = running ? 'Pause' : 'Weiter';
  $('startBtn').classList.toggle('pause', running);
  save();
};
$('centerBtn').onclick = () => { follow = true; if (last) map.setView([last.lat, last.lon], 16); };
$('resetBtn').onclick = () => {
  if (!confirm('Fahrt zurücksetzen?')) return;
  distM = 0; maxKmh = 0; movingMs = 0; track.setLatLngs([[]]); newSeg = true;
  climbM = 0; descM = 0; altRef = null; lastGood = null; spdHist = [];
  running = false; keepAwake(false);
  $('startBtn').textContent = 'Start'; $('startBtn').classList.remove('pause');
  render(0);
  save();
};
map.on('dragstart', () => follow = false);
setInterval(() => { if (running) save(); }, 5000);

// ---- Navigation: Fahrradroute (FOSSGIS/OSRM) + Adresssuche (Nominatim), beides kostenlos ohne Key ----
// Valhalla (FOSSGIS) liefert direktere Radrouten als OSRM (im Test ~16 % kürzer); OSRM als weitere Variante/Reserve
const VALHALLA = 'https://valhalla1.openstreetmap.de/route?json=';
const ROUTER = 'https://routing.openstreetmap.de/routed-bike/route/v1/driving/';
const ALTCOL = ['#4ea1ff', '#f0b429', '#c678dd', '#56d4dd', '#ff7b72'];
const altLayer = L.layerGroup().addTo(map);   // Routenvorschläge während der Auswahl
const GEOCODER = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=de&q=';
let nav = null;          // {mode:'route'|'gpx', dest:{lat,lon,name}, pts:[[lat,lon]], steps:[{d,a,t}], cum, total, idx, along}
let pendingDest = null;  // Ziel gewählt, aber noch keine GPS-Position
let routing = false, offCount = 0, lastReroute = 0, arriveTimer = null;

const ll = p => ({lat:p[0], lon:p[1]});
const fmtDist = m => m < 995 ? `${Math.round(m/10)*10} m` : `${(m/1000).toFixed(1).replace('.', ',')} km`;
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);

// Abbiegehinweise auf Deutsch aus den OSRM-Schritten
const ARROW = {uturn:'⤺', 'sharp right':'↘', right:'→', 'slight right':'↗', straight:'↑', 'slight left':'↖', left:'←', 'sharp left':'↙'};
const DIR = {uturn:'wenden', 'sharp right':'scharf rechts abbiegen', right:'rechts abbiegen', 'slight right':'leicht rechts halten',
  straight:'geradeaus weiter', 'slight left':'leicht links halten', left:'links abbiegen', 'sharp left':'scharf links abbiegen'};
function stepText(s){
  const m = s.maneuver, mod = m.modifier || 'straight', side = mod.includes('left') ? 'links' : 'rechts';
  const name = s.name || s.ref || '', on = name ? ` · ${name}` : '';
  switch (m.type) {
    case 'depart': return {a:'↑', t:'Losfahren' + on};
    case 'arrive': return {a:'🏁', t:'Ziel erreicht'};
    case 'roundabout': case 'rotary': case 'roundabout turn':
      return {a:'⟳', t:`Im Kreisverkehr ${m.exit ? m.exit + '. Ausfahrt' : 'ausfahren'}${on}`};
    case 'exit roundabout': case 'exit rotary': return null;   // schon beim Kreisverkehr angesagt
    case 'new name': case 'continue': if (mod === 'straight') return null; break;
    case 'end of road': return {a:ARROW[mod] || '↑', t:`Am Straßenende ${side}${on}`};
    case 'fork': return {a:ARROW[mod] || '↑', t:`An der Gabelung ${side} halten${on}`};
  }
  return {a:ARROW[mod] || '↑', t:cap(DIR[mod] || 'weiter') + on};
}

// Pfeile als SVG (scharf, blau mit dunkler Kontur); Winkel je Richtungszeichen aus stepText()
const ANGLE = {'↑':0, '↗':45, '→':90, '↘':135, '⤺':180, '↙':-135, '←':-90, '↖':-45};
function arrowSvg(a){
  if (a === '⟳') return '<svg viewBox="-50 -50 100 100"><circle r="26" fill="none" stroke="#0e1116" stroke-width="18"/>'
    + '<circle r="26" fill="none" stroke="#4ea1ff" stroke-width="10"/><path d="M26,-30 L44,-4 L12,-4 Z" fill="#4ea1ff" stroke="#0e1116" stroke-width="4" stroke-linejoin="round" paint-order="stroke"/></svg>';
  if (!(a in ANGLE)) return null;
  return `<svg viewBox="-50 -50 100 100"><path transform="rotate(${ANGLE[a]})" d="M0,-44 L32,-6 L11,-6 L11,42 L-11,42 L-11,-6 L-32,-6 Z"
    fill="#4ea1ff" stroke="#0e1116" stroke-width="7" stroke-linejoin="round" paint-order="stroke"/></svg>`;
}
// Navi-Anzeige: Mitte Pfeil + Meter (+ optional Text/Untertext), rechts oben 🏁 mit Rest-km und Ankunftszeit
function navShow(arrow, dist, text, sub, eta){
  clearTimeout(arriveTimer);
  $('navBar').hidden = false;
  const svg = arrowSvg(arrow);
  if (svg) $('navArrow').innerHTML = svg; else $('navArrow').textContent = arrow;
  $('navDist').textContent = dist || ''; $('navText').textContent = text || ''; $('navSub').textContent = sub || '';
  $('navEta').hidden = !eta;
  if (eta) { $('navRest').textContent = eta.rest; $('navTime').textContent = eta.time; }
}

function setNav(n, fit){
  n.cum = cumDist(n.pts);
  n.total = n.cum[n.cum.length-1]; n.idx = 0; n.along = 0;
  nav = n; offCount = 0;
  routeLine.setLatLngs(n.pts);
  destMarker.setLatLng([n.dest.lat, n.dest.lon]); if (!map.hasLayer(destMarker)) destMarker.addTo(map);
  try { localStorage.setItem('nav', JSON.stringify({mode:n.mode, dest:n.dest, steps:n.steps, profile:n.profile,
    pts:n.pts.map(p => [+p[0].toFixed(6), +p[1].toFixed(6)])})); } catch(_) {}
  if (fit) { follow = running; map.fitBounds(routeLine.getBounds(), {padding:[40,40]}); }
  if (last) updateNav(last, 0);
  else navShow('↑', '', n.mode === 'gpx' ? 'GPX-Route geladen' : 'Route berechnet', `${fmtDist(n.total)} · warte auf GPS`);
}

function endNav(){
  nav = null; pendingDest = null;
  routeLine.setLatLngs([]); if (map.hasLayer(destMarker)) map.removeLayer(destMarker);
  $('navBar').hidden = true;
  try { localStorage.removeItem('nav'); } catch(_) {}
}

const cumDist = pts => { const c = [0]; for (let i = 1; i < pts.length; i++) c.push(c[i-1] + haversine(ll(pts[i-1]), ll(pts[i]))); return c; };

// Valhalla-Geometrie (encoded polyline, 6 Nachkommastellen) entpacken
function decode6(str){
  const out = []; let i = 0, lat = 0, lon = 0;
  while (i < str.length) {
    for (let k = 0; k < 2; k++) {
      let r = 0, sh = 0, b;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
      const d = r & 1 ? ~(r >> 1) : r >> 1;
      if (k) lon += d; else lat += d;
    }
    out.push([lat / 1e6, lon / 1e6]);
  }
  return out;
}
// Valhalla-Manövertypen → Pfeil (null = kein Hinweis nötig, z. B. geradeaus/Straßenname ändert sich)
function valStep(m){
  const t = m.type;
  if (t === 26) return {a:'⟳', t:`Im Kreisverkehr ${m.roundabout_exit_count ? m.roundabout_exit_count + '. Ausfahrt' : 'ausfahren'}`};
  if (t >= 4 && t <= 6) return {a:'🏁', t:'Ziel erreicht'};
  const A = {9:'↗', 23:'↗', 20:'↗', 18:'↗', 37:'↗', 10:'→', 11:'↘', 12:'⤺', 13:'⤺', 14:'↙', 15:'←', 16:'↖', 24:'↖', 21:'↖', 19:'↖', 38:'↖'};
  return A[t] ? {a:A[t], t:''} : null;
}
// Valhalla-Radroute(n). roads: 0 = Hauptstraßen meiden … 1 = gern auf Hauptstraßen (weniger Abbiegen); alts = Anzahl Alternativen
async function routeValhalla(from, dest, roads, alts){
  const q = {locations:[{lat:from.lat, lon:from.lon}, {lat:dest.lat, lon:dest.lon}], costing:'bicycle',
    costing_options:{bicycle:{bicycle_type:'Hybrid', use_roads:roads}}, directions_type:'maneuvers'};
  if (alts) q.alternates = alts;
  const r = await (await fetch(VALHALLA + encodeURIComponent(JSON.stringify(q)))).json();
  if (!r.trip || !r.trip.legs) throw new Error(r.error || 'keine Route gefunden');
  return [r.trip, ...(r.alternates || []).map(a => a.trip)].map(trip => {
    const leg = trip.legs[0], pts = decode6(leg.shape), cum = cumDist(pts), steps = [];
    for (const m of leg.maneuvers) { const x = valStep(m); if (x) steps.push({d: cum[m.begin_shape_index] || 0, a:x.a, t:x.t}); }
    return {pts, steps, sec: trip.summary.time, profile:{kind:'v', roads}};
  });
}
async function routeOsrm(from, dest){
  const r = await (await fetch(`${ROUTER}${from.lon},${from.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true`)).json();
  if (r.code !== 'Ok' || !r.routes || !r.routes.length) throw new Error(r.message || 'keine Route gefunden');
  const rt = r.routes[0], steps = []; let d = 0;
  for (const s of rt.legs.flatMap(l => l.steps)) { const x = stepText(s); if (x) steps.push({d, a:x.a, t:x.t}); d += s.distance; }
  return [{pts: rt.geometry.coordinates.map(([lon, lat]) => [lat, lon]), steps, sec: rt.duration, profile:{kind:'o'}}];
}

// Hin-und-zurück entfernen: Kommt die Route nach > 80 m wieder auf < 25 m an eine frühere Stelle zurück
// (z. B. erst auf dem Radweg in die falsche Richtung, wenden, auf der anderen Straßenseite zurück),
// wird das Stück durch den direkten Weg ersetzt. Die aktuelle Position zählt als erster Punkt mit.
function removeBacktracks(pts, steps, start){
  let P = [[start.lat, start.lon], ...pts], cum = cumDist(P);
  let S = steps.map(s => ({...s, d: s.d + cum[1]}));
  const kx = Math.cos(start.lat * Math.PI / 180) * 111320, ky = 110540;
  const near = (a, b) => Math.hypot((a[1] - b[1]) * kx, (a[0] - b[0]) * ky);
  const bearing = (a, b) => Math.atan2((b[1] - a[1]) * kx, (b[0] - a[0]) * ky) * 180 / Math.PI;
  for (let i = 0; i < P.length - 2; i++) {
    let j = -1;
    for (let k = P.length - 1; k > i + 1 && cum[k] - cum[i] > 80; k--) {
      const dd = near(P[i], P[k]);
      if (dd < 25 && cum[k] - cum[i] > 4 * dd) { j = k; break; }
    }
    if (j < 0) continue;
    const from = cum[i], to = cum[j], saved = to - from - near(P[i], P[j]);
    S = S.filter(s => s.d <= from || s.d >= to).map(s => s.d >= to ? {...s, d: s.d - saved} : s);
    if (i > 0 && j < P.length - 1) {   // an der Abkürzung einen Richtungshinweis setzen
      let turn = bearing(P[j], P[j+1]) - bearing(P[i-1], P[i]);
      turn = ((turn + 540) % 360) - 180;
      const t = Math.abs(turn), right = turn > 0;
      const a = t < 25 ? null : t < 60 ? (right ? '↗' : '↖') : t < 120 ? (right ? '→' : '←') : t < 165 ? (right ? '↘' : '↙') : '⤺';
      if (a) S.push({d: from, a, t:''});
    }
    P.splice(i + 1, j - i - 1);
    cum = cumDist(P);
  }
  S.sort((a, b) => a.d - b.d);
  return {pts: P, steps: S};
}
// Kennzahlen einer Route: Länge und Anzahl Abbiegungen (ohne Start/Ziel)
function finishRoute(r, from){
  const x = removeBacktracks(r.pts, r.steps, from);
  const len = cumDist(x.pts).pop();
  return {...r, pts: x.pts, steps: x.steps, len, turns: x.steps.filter(s => s.a !== '↑' && s.a !== '🏁').length,
    sec: r.sec * len / Math.max(1, cumDist(r.pts).pop())};
}
// Fast gleiche Routen erkennen: 90 % der Punkte von b liegen höchstens 25 m neben a
function sameRoute(a, b){
  const kx = Math.cos(a.pts[0][0] * Math.PI / 180) * 111320, ky = 110540, n = 24;
  let hit = 0;
  for (let k = 0; k < n; k++) {
    const q = b.pts[Math.floor(k * (b.pts.length - 1) / (n - 1))];
    let best = Infinity;
    for (let i = 0; i < a.pts.length - 1; i++) {
      const ax = (a.pts[i][1]-q[1])*kx, ay = (a.pts[i][0]-q[0])*ky, dx = (a.pts[i+1][1]-a.pts[i][1])*kx, dy = (a.pts[i+1][0]-a.pts[i][0])*ky;
      const l2 = dx*dx + dy*dy, t = l2 ? Math.max(0, Math.min(1, -(ax*dx + ay*dy)/l2)) : 0;
      best = Math.min(best, Math.hypot(ax + t*dx, ay + t*dy));
    }
    if (best < 25) hit++;
  }
  return hit >= n * 0.9;
}

// Neuberechnung unterwegs: gleiche Variante wie gewählt, ohne Nachfrage
async function routeTo(dest, from, fit, profile){
  routing = true;
  navShow('…', '', nav ? 'Neue Route wird berechnet' : 'Route wird berechnet', dest.name || '');
  try {
    let list;
    const prof = profile || {kind:'v', roads:0.5};
    try { list = prof.kind === 'o' ? await routeOsrm(from, dest) : await routeValhalla(from, dest, prof.roads, 0); }
    catch(e) { list = prof.kind === 'o' ? await routeValhalla(from, dest, 0.5, 0) : await routeOsrm(from, dest); }   // Reserve
    const r = finishRoute(list[0], from);
    routing = false;
    setNav({mode:'route', dest, steps: r.steps, pts: r.pts, profile: r.profile}, fit);
  } catch(e) {
    navShow('⚠', '', 'Routing fehlgeschlagen', e.message + (navigator.onLine ? '' : ' (offline)'));
  } finally { routing = false; }
}

// Neues Ziel: mehrere Varianten berechnen und zur Auswahl anbieten
async function planRoutes(dest, from){
  routing = true;
  navShow('…', '', 'Routen werden berechnet', dest.name || '');
  const jobs = [routeValhalla(from, dest, 0.5, 2),    // direkt + Alternativen
                routeValhalla(from, dest, 0.9, 0),    // mehr auf Hauptstrecken → weniger Abbiegen
                routeOsrm(from, dest)];
  const res = await Promise.allSettled(jobs);
  routing = false;
  let routes = res.filter(x => x.status === 'fulfilled').flatMap(x => x.value).map(r => finishRoute(r, from));
  if (!routes.length) {
    const err = res.find(x => x.status === 'rejected');
    navShow('⚠', '', 'Routing fehlgeschlagen', (err ? err.reason.message : '') + (navigator.onLine ? '' : ' (offline)'));
    return;
  }
  routes.sort((a, b) => a.len - b.len);
  const uniq = [];
  for (const r of routes) if (!uniq.some(u => sameRoute(u, r))) uniq.push(r);
  routes = uniq.slice(0, 4);
  if (routes.length === 1) { useRoute(routes[0], dest); return; }
  const fewest = routes.reduce((m, r) => r.turns < m.turns ? r : m, routes[0]);
  $('navBar').hidden = true;
  altLayer.clearLayers();
  const list = $('routeList'); list.textContent = '';
  routes.forEach((r, i) => {
    r.color = ALTCOL[i % ALTCOL.length];
    const line = L.polyline(r.pts, {color:r.color, weight: i ? 5 : 7, opacity:.85}).addTo(altLayer);
    line.on('click', () => useRoute(r, dest));
    const tags = [i === 0 ? 'Kürzeste' : null, r === fewest && i !== 0 ? 'Wenigste Abbiegungen' : null].filter(Boolean);
    const li = document.createElement('li');
    li.innerHTML = `<span class="sw" style="background:${r.color}"></span><div><div class="m"></div><div class="s"></div></div>`;
    li.querySelector('.m').textContent = `${fmtDist(r.len)} · ${Math.round(r.sec / 60)} min`;
    li.querySelector('.s').textContent = [...tags, `${r.turns} Abbiegungen`].join(' · ');
    li.onclick = () => useRoute(r, dest);
    list.appendChild(li);
  });
  $('routePick').hidden = false;
  follow = false;
  // Routen oberhalb der Auswahlliste einpassen
  map.fitBounds(L.featureGroup(altLayer.getLayers()).getBounds(),
    {paddingTopLeft:[30, 30], paddingBottomRight:[30, $('routePick').offsetHeight + 24]});
}
function useRoute(r, dest){
  altLayer.clearLayers(); $('routePick').hidden = true;
  setNav({mode:'route', dest, steps: r.steps, pts: r.pts, profile: r.profile}, true);
}
$('routeCancel').onclick = () => { altLayer.clearLayers(); $('routePick').hidden = true; $('navBar').hidden = !nav; };

// Position auf die Route projizieren: nächster Punkt auf der Linie + gefahrene Strecke entlang der Route
function project(lat, lon){
  const pts = nav.pts, kx = Math.cos(lat*Math.PI/180)*111320, ky = 110540;
  let best = {dist:Infinity, i:0, along:0};
  const scan = (from, to) => {
    for (let i = Math.max(0, from); i < Math.min(pts.length-1, to); i++) {
      const ax = (pts[i][1]-lon)*kx, ay = (pts[i][0]-lat)*ky, dx = (pts[i+1][1]-pts[i][1])*kx, dy = (pts[i+1][0]-pts[i][0])*ky;
      const l2 = dx*dx + dy*dy, t = l2 ? Math.max(0, Math.min(1, -(ax*dx + ay*dy)/l2)) : 0;
      const d = Math.hypot(ax + t*dx, ay + t*dy);
      if (d < best.dist) best = {dist:d, i, along: nav.cum[i] + t*(nav.cum[i+1]-nav.cum[i])};
    }
  };
  scan(nav.idx - 10, nav.idx + 300);           // zuerst in der Nähe der letzten Position (wichtig bei Rundkursen)
  if (best.dist > 40) scan(0, pts.length);     // sonst ganze Route
  return best;
}

function updateNav(pt, acc){
  if (pendingDest && !routing) { const d = pendingDest; pendingDest = null; planRoutes(d, pt); return; }
  if (!nav || routing) return;
  const p = project(pt.lat, pt.lon);
  if (acc < 30) {
    if (p.dist > 40) offCount++;
    else { offCount = 0; nav.idx = p.i; nav.along = p.along; }
  }
  const rest = Math.max(0, nav.total - nav.along);
  if (rest < 25) {
    const name = nav.dest.name || '';
    endNav();
    navShow('🏁', '', 'Ziel erreicht', name);
    arriveTimer = setTimeout(() => { if (!nav) $('navBar').hidden = true; }, 10000);
    return;
  }
  // Ankunftszeit: eigener Schnitt, solange noch keiner da ist 18 km/h
  const avg = movingMs > 60000 ? (distM/1000)/(movingMs/3600000) : 0;
  const eta = new Date(Date.now() + rest / ((avg > 5 ? avg : 18)/3.6) * 1000)
    .toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
  const info = {rest: fmtDist(rest), time: eta};
  if (offCount >= 3) {
    if (nav.mode === 'route' && Date.now() - lastReroute > 10000) { lastReroute = Date.now(); routeTo(nav.dest, pt, false, nav.profile); return; }
    navShow('⚠', fmtDist(p.dist), 'neben der Route', '', info);
    return;
  }
  // Nur die nächste Abbiegung (danach nur noch das Ziel)
  const next = nav.steps.find(s => s.d > nav.along + 3);
  const exit = next && next.a === '⟳' ? (next.t.match(/\d+\. Ausfahrt/) || [''])[0] : '';  // beim Kreisverkehr: welche Ausfahrt
  if (next) navShow(next.a, fmtDist(next.d - nav.along), exit, '', info);
  else navShow('🏁', fmtDist(rest), '', '', info);
}

function chooseDest(dest){
  $('navPanel').hidden = true; map.closePopup();
  if (last) planRoutes(dest, last);
  else { pendingDest = dest; navShow('…', '', 'Warte auf GPS', dest.name || ''); }
}

async function searchPlace(q){
  const list = $('navResults');
  list.innerHTML = '<li class="muted">Suche …</li>';
  let url = GEOCODER + encodeURIComponent(q);
  if (last) url += `&viewbox=${last.lon-0.5},${last.lat+0.3},${last.lon+0.5},${last.lat-0.3}`;  // Treffer in der Nähe bevorzugen
  try {
    const res = await (await fetch(url)).json();
    list.innerHTML = '';
    if (!res.length) { list.innerHTML = '<li class="muted">Nichts gefunden</li>'; return; }
    for (const r of res) {
      const parts = r.display_name.split(', '), title = parts.slice(0, 2).join(', ');
      const li = document.createElement('li'); li.textContent = title;
      const sm = document.createElement('small'); sm.textContent = parts.slice(2).join(', '); li.appendChild(sm);
      li.onclick = () => chooseDest({lat:+r.lat, lon:+r.lon, name:title});
      list.appendChild(li);
    }
  } catch(_) { list.innerHTML = '<li class="muted">Suche fehlgeschlagen (kein Netz?)</li>'; }
}

function loadGpx(file){
  const rd = new FileReader();
  rd.onload = () => {
    const doc = new DOMParser().parseFromString(rd.result, 'application/xml');
    let els = [...doc.getElementsByTagName('trkpt')];
    if (!els.length) els = [...doc.getElementsByTagName('rtept')];
    const pts = els.map(e => [+e.getAttribute('lat'), +e.getAttribute('lon')]).filter(p => isFinite(p[0]) && isFinite(p[1]));
    if (pts.length < 2) { alert('Keine Route in der GPX-Datei gefunden.'); return; }
    const nm = doc.getElementsByTagName('name')[0];
    $('navPanel').hidden = true;
    setNav({mode:'gpx', steps:[], pts, dest:{lat:pts[pts.length-1][0], lon:pts[pts.length-1][1],
      name: nm ? nm.textContent.trim() : file.name.replace(/\.gpx$/i, '')}}, true);
  };
  rd.readAsText(file);
}

$('navBtn').onclick = () => { $('navPanel').hidden = !$('navPanel').hidden; $('navEnd').hidden = !nav && !pendingDest; };
$('navClose').onclick = () => { $('navPanel').hidden = true; };
$('navEnd').onclick = () => { endNav(); $('navPanel').hidden = true; };
$('navForm').onsubmit = e => { e.preventDefault(); const q = $('navQuery').value.trim(); if (q) { $('navQuery').blur(); searchPlace(q); } };
$('gpxFile').onchange = e => { const f = e.target.files[0]; if (f) loadGpx(f); e.target.value = ''; };
// Langes Drücken auf die Karte (bzw. Rechtsklick am PC) → Ziel setzen
map.on('contextmenu', e => {
  const b = document.createElement('button'); b.textContent = 'Hierhin navigieren';
  b.onclick = () => chooseDest({lat:e.latlng.lat, lon:e.latlng.lng, name:'Punkt auf der Karte'});
  L.popup({closeButton:false}).setLatLng(e.latlng).setContent(b).openOn(map);
});
function restoreNav(){
  try { const n = JSON.parse(localStorage.getItem('nav') || 'null'); if (n && n.pts && n.pts.length > 1) setNav(n, false); } catch(_) {}
}

restore();
restoreNav();
startGps(); // Position schon vor dem Start anzeigen
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
